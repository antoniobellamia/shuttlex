name: Deploy su Altervista via FTP

on:
  push:
    branches:
      - main # Lo script parte solo quando fai push sul main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Ottieni il codice più recente
        uses: actions/checkout@v4
      
      - name: 📂 Sincronizza i file su Altervista
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: / # Lascia / se vuoi caricare nella cartella principale