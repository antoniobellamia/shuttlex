name: Deploy su Altervista

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Sincronizza file via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Scarica codice dal repository
        uses: actions/checkout@v4

      - name: Carica su Altervista via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.mels.altervista.org
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.sql
            **/*.md
            **/*.docx
            **/*.pdf